analysis:
  chart_dir: data/charts
  save_charts: false
  show_backtest: true
backtest:
  end_date: null
  initial_capital: 10000
  start_date: '2020-01-01'
data_source:
  cache_enabled: true
  provider: akshare
logging:
  console: true
  file: logs/trading.log
  level: INFO
report:
  blas_threads: 1
  default_stock_codes_file: config/report_codes_132.txt
  executor: process
  max_workers: null
  verbose: false
strategy:
  init_d: 50.0
  init_date: '2018-01-02'
  init_k: 50.0
  k_threshold: 45
  lookback_days: 160
  mid_ma: 45
  rsi_enabled: true
  rsi_fast_period: 5
  rsi_ma_ratio: 0.95
  rsi_min_gap: 5
  rsi_min_strength: true
  rsi_oversold: 18
  rsi_slow_period: 10
  rsi_threshold: 40
  short_ma: 16
  stop_loss: -15.0
