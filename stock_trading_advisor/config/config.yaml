# 股票交易策略配置文件

# 数据源配置
data_source:
  provider: 'akshare'  # 数据源: akshare, tushare, yfinance
  cache_enabled: true   # 是否启用缓存

# 市场支持说明
# 支持的市场类型:
# - A股: 6位数字代码 (如 000001, 600519) 或带前缀 (sh600519, sz000001)
# - 港股: 5位数字代码 (如 00700, 01810) 或带后缀 (00700.HK)
# - 美股: 字母代码 (如 AAPL, TSLA)

# 策略参数配置
strategy:
  init_k: 50.0           # KDJ 初始 K 值
  init_d: 50.0           # KDJ 初始 D 值
  init_date: '2018-01-02'  # 回测起始日期
  short_ma: 16           # 短期均线周期
  mid_ma: 45             # 中期均线周期
  k_threshold: 45        # K 值买入阈值
  stop_loss: -15.0       # 跌停保护阈值
  lookback_days: 160     # 背离检测回溯天数（优化：100→160⭐）

  # RSI增强买入参数（优化v4：优化快慢线周期，提升收益率）
  rsi_enabled: true          # 是否启用RSI增强买入
  rsi_fast_period: 5         # RSI快线周期（优化：6→5⭐，更快响应市场变化）
  rsi_slow_period: 10        # RSI慢线周期（优化：14→10⭐，提升平均收益+128.93%）
  rsi_oversold: 18           # RSI极度超卖阈值（v3：20→18，只抓极端机会）
  rsi_threshold: 40          # RSI金叉阈值（v3：45→40，只在极低位）
  rsi_ma_ratio: 0.95         # RSI超卖时接近均线比例
  rsi_min_strength: true     # 是否要求最小强度（MACD>0.1 或 涨幅>3%）
  rsi_min_gap: 5             # RSI买入最小间隔天数（5天冷静期，避免频繁交易）

  # RSI趋势策略参数（优化：使用激进配置获得最佳收益）
  trend_rsi_fast_period: 9     # 快RSI周期（优化：25→9，提升收益42%）
  trend_rsi_slow_period: 21    # 慢RSI周期（优化：100→21，最佳性价比）
  trend_atr_period: 20         # ATR周期
  trend_atr_multiplier: 3.0    # ATR倍数
  trend_relaxed_entry: true    # 启用放宽入场条件
  trend_relaxed_min_gap: 1.0   # 放宽入场最小差值
  trend_use_zigzag_filter: false  # 禁用之字形过滤（减少误判）
  trend_stop_loss_pct: 7.0     # 止损百分比
  trend_exit_use_ma_filter: true  # 启用MA过滤退出
  trend_lr_filter_enabled: true   # 启用线性回归过滤
  trend_mtf_enabled: true      # 启用多时间框架确认
  
  # 双通道策略：长期趋势确认 + 短期回调买点
  trend_dual_channel_enabled: false  # 启用双通道策略（默认关闭，需验证效果）
  trend_dual_channel_long: 60        # 长期通道周期（60日确认主趋势）
  trend_dual_channel_short: 20       # 短期通道周期（20日捕捉回调）
  trend_dual_channel_dev: 2.0        # 通道标准差倍数

# 回测配置
backtest:
  initial_capital: 10000  # 初始资金（元）
  start_date: '2020-01-01'  # 回测开始日期
  end_date: null          # 回测结束日期（null 表示当前日期）

# 日志配置
logging:
  level: 'INFO'          # 日志级别: DEBUG, INFO, WARNING, ERROR
  file: 'logs/trading.log'  # 日志文件路径
  console: true          # 是否输出到控制台

# 分析配置
analysis:
  show_backtest: true    # 是否显示回测结果
  save_charts: false     # 是否保存图表
  chart_dir: 'data/charts'  # 图表保存目录

# 报告生成配置
report:
  max_workers: null      # 多线程回测线程数（null 自动使用CPU核心数）
